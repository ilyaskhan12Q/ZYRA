<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="zyra-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="glow-fx" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Obsidian Badge Container -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg-grad)" stroke="#30363d" stroke-width="2" />

  <!-- Subtle Metric Grid Overlay -->
  <path d="M8 44h112M8 84h112M44 8v112M84 8v112" stroke="#21262d" stroke-width="1" stroke-dasharray="2 3" />

  <!-- Minimalist ZYRA Z-Monogram -->
  <!-- Top Horizontal Bar -->
  <path d="M34 38 h60 l-14 14 H34 Z" fill="url(#zyra-grad)" />
  
  <!-- Dynamic Diagonal Telemetry Vector -->
  <path d="M78 46 L38 90 h18 l40 -44 Z" fill="url(#zyra-grad)" filter="url(#glow-fx)" opacity="0.95" />
  
  <!-- Bottom Horizontal Bar -->
  <path d="M34 90 h60 l-14 -14 H48 Z" fill="url(#zyra-grad)" />

  <!-- Pulse Pins -->
  <circle cx="94" cy="38" r="3.5" fill="#58a6ff" />
  <circle cx="34" cy="90" r="3.5" fill="#2ea043" />
</svg>
